---
- name: CIS compliance audit and remediation
  hosts: fleet
  become: true
  gather_facts: true

  roles:
    - { role: cis_ssh, tags: [ssh] }
    - { role: cis_firewall, tags: [firewall] }
    - { role: cis_users, tags: [users] }
    - { role: cis_file_permissions, tags: [files] }
    - { role: cis_services, tags: [services] }
    - { role: cis_updates, tags: [updates] }
    - { role: cis_logging, tags: [logging] }
    - { role: cis_network, tags: [network] }

- name: Build compliance report
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  roles:
    - { role: cis_report, tags: [always] }
