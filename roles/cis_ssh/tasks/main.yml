---
# 1. AUDIT: read the settings SSH is really using (read-only, so don't pretend)
- name: "SSH | Read effective SSH settings"
  ansible.builtin.command: sshd -T
  register: cis_ssh_effective
  check_mode: false
  changed_when: false

# 2. Turn the output into a lookup table, e.g. {'permitrootlogin': 'no', ...}
- name: "SSH | Build lookup table of current values"
  ansible.builtin.set_fact:
    cis_ssh_current: "{{ dict(cis_ssh_effective.stdout_lines | map('split', ' ', 1)) }}"

# 3. FIX: write our rules into our own file (pretends in check mode)
- name: "SSH | Write CIS hardening file"
  ansible.builtin.copy:
    dest: "{{ cis_ssh_config_file }}"
    content: |
      # Managed by Ansible (cis_ssh role). Manual edits will be overwritten.
      {% for s in cis_ssh_settings %}
      {{ s.directive }} {{ s.value }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  notify: Restart ssh

# 4. SAFETY NET: test the whole SSH config; if broken, stop before any restart
- name: "SSH | Test full SSH configuration"
  ansible.builtin.command: sshd -t
  check_mode: false
  changed_when: false

# 5. RECORD: one result per control for the report
- name: "SSH | Record compliance result"
  ansible.builtin.set_fact:
    cis_results: "{{ cis_results | default([]) + [{
      'id': item.id,
      'control': item.title,
      'expected': item.value,
      'found': cis_ssh_current[item.key] | default('not set'),
      'status': 'PASS' if (cis_ssh_current[item.key] | default('')) == item.value
                else ('FAIL' if ansible_check_mode else 'FIXED')
      }] }}"
  loop: "{{ cis_ssh_settings }}"
  loop_control:
    label: "{{ item.id }}"
